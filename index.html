<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asterism — Your day, charted.</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#141a38 0%,#0a0d20 55%,#070912 100%);
    color:#f6ead2; font-family:Georgia,'Times New Roman',serif; padding:24px; }
  .card { max-width:520px; text-align:center; }
  svg { width:180px; height:auto; margin-bottom:20px; }
  h1 { font-size:2.4rem; letter-spacing:.35em; font-weight:normal; text-indent:.35em; }
  .tag { color:#f0a24a; font-style:italic; margin:10px 0 26px; font-size:1.1rem; }
  .status { display:inline-block; border:1px solid rgba(246,234,210,.35); border-radius:999px;
    padding:7px 16px; font-size:.85rem; letter-spacing:.12em; }
  .dot { color:#7dd87d; }
  p.note { margin-top:26px; color:rgba(246,234,210,.65); font-size:.95rem; line-height:1.55; }
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polyline points="0,95 45,45 80,75 120,30 160,70 200,40" fill="none" stroke="#ff7a59" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="0,110 55,70 95,95 140,55 200,90" fill="none" stroke="#f0a24a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#f6ead2">
        <circle cx="45" cy="45" r="6"/><circle cx="120" cy="30" r="7"/>
        <circle cx="200" cy="40" r="5"/><circle cx="55" cy="70" r="5"/><circle cx="140" cy="55" r="6"/>
      </g>
    </svg>
    <h1>ASTERISM</h1>
    <div class="tag">Your day, charted.</div>
    <div class="status"><span class="dot">●</span>&nbsp; LIVE SKY FEED ACTIVE</div>
    <p class="note">This site hosts the live sky file for the Asterism app.
    The app reads it silently in the background — there's nothing to open or download here.</p>
  </div>
</body>
</html>
